[project]
name = "netassist"
version = "0.1.0"
description = "Console interactive d'inventaire Nmap et de reporting pour périmètres autorisés"
requires-python = ">=3.12"
dependencies = ["rich>=13.7"]

[project.scripts]
netassist = "netassist.app:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
